# Install to /etc/systemd/system/docker.service.d/, then systemctl daemon-reload.
#
# Holds Docker back until the NAS mounts are ready. Without this, dockerd races
# them at boot and the containers bind to the empty directories underneath the
# mountpoints, permanently, because bind mounts resolve only once.
#
# Requires, not Wants: if the NAS is unreachable Docker will not start at all.
# Starting without it is what caused the problem.

[Unit]
RequiresMountsFor=/mnt/media /mnt/immich
